[build-system]
requires = ["setuptools>=45.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanobrain"
version = "0.1.0"
description = "Event-driven AI agent framework for distributed workflows (RESEARCH PREVIEW)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "aiofiles>=23.0.0",
    # aiohttp: library/tools/bioinformatics/bv_brc_tool.py imports this at
    # module top. Previously undeclared — module import fails on fresh install.
    # Same shape of gap as the 2026-04-21 aiofiles fix.
    "aiohttp>=3.9",
    # aiosqlite: library/__init__.py's eager workflow imports need this;
    # without it, ``import nanobrain.library`` raises ModuleNotFoundError.
    "aiosqlite>=0.19",
    "cachetools>=5.0.0",
    "psutil>=5.0.0",
    "pandas>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "requests>=2.31.0",
    # httpx: library/tools/bioinformatics/pubmed_client.py imports this for
    # async NCBI E-utils calls (Phase 4B, 2026-05-04). Previously undeclared.
    # Same shape of gap as the 2026-04-21 aiofiles + 2026-04-?? aiohttp fixes.
    "httpx>=0.25.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
llm = [
    # core/agent.py unconditionally attempts ``from openai import AsyncOpenAI``
    # at _initialize_llm_client time. Without this dep the try/except pretends
    # to silently disable LLM support, but the real failure is UnboundLocalError
    # on the logger fallback path — see scope memo 07 (apecx-mcp-integration).
    # The OpenAI client library works for both api.openai.com AND any
    # OpenAI-compatible endpoint (Ollama, vLLM, llama.cpp-server) via base_url.
    "openai>=1.0",
]
distributed = [
    "parsl>=2024.6.10",
]
academy = [
]
rag = [
    "sentence-transformers>=2.2.2,<3.0.0",
    "faiss-cpu>=1.7.4",
    "numpy>=1.24.0",
]
dev = [
    "pytest>=7.0.0",
]
test = [
    # Canonical test stack used by tests/unit/ + the CI workflow.
    # ``dev`` stays minimal so light-touch contributors only get pytest;
    # ``test`` is the maintainer-grade extra that includes everything
    # the integration tests (G5 ProxyStore, G21 Postgres) need.
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    # G3 / G5 — ProxyStore for cross-process resume + transport.
    "proxystore>=0.6",
    # G21 Step 4 — psycopg 3 for PostgresTaskStore integration tests.
    # ``psycopg[binary]`` includes the libpq C wheel; no system libpq
    # required. Skip unless the operator sets POSTGRES_TEST_DSN.
    "psycopg[binary]>=3.1",
    # G5 Step 2 RedisKey — proxystore[redis] pulls in the redis client
    # transitively; if that ever stops being true, add ``redis>=5.0``
    # explicitly here.
]
all = [
    "nanobrain[llm,distributed,academy,rag,dev]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nanobrain*"]
exclude = ["tests*", "docs*", "demos*", "scripts*", "config*", "logs*", "results*"]


# ---------------------------------------------------------------------------
# [tool.ruff] — gating lint configuration (2026-05-09 infra chain)
# ---------------------------------------------------------------------------
#
# History: pre-2026-05-09 the repo had ZERO ruff enforcement (1248 errors
# at first run). The autofixable 1023 were applied; the remaining 201 are
# either (a) intentional patterns (re-export shims, forward-reference
# type hints) or (b) legacy modules slated for removal that aren't worth
# fixing.
#
# This config:
# 1. Pins the target Python version so `ruff` knows what builtins to expect.
# 2. Selects the canonical defaults (E + F) — same set ruff applies by
#    default, declared explicitly so future ruff versions don't surprise.
# 3. Per-file-ignores carve out the deliberate cases below.
# 4. ``ignore`` covers categories where the autofix removed code that was
#    actually used (e.g., re-exports). Each entry has a comment.
#
# When a category here is genuinely cleaned up across the codebase,
# remove its ignore from this file in the same PR.
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Select the default ruleset (pyflakes F + pycodestyle E). W (pycodestyle
# warnings) NOT selected — too noisy on whitespace in this codebase
# without a separate cleanup pass; enable later if desired.
select = ["E", "F"]

# Repo-wide ignores — categories with too many false positives in this
# codebase to gate on without a substantial cleanup. Each entry has a
# documented reason; remove from this list when the codebase is clean
# of that category and you want to gate on it going forward.
ignore = [
    # Forward-reference type hints (G12 ResourceEnvelope, etc.) live as
    # strings; Python never resolves them. Ruff flags them anyway.
    # Eliminating these requires either ``from __future__ import annotations``
    # everywhere or actual import shuffling. Defer.
    "F821",
    # Star imports: ``__init__.py`` re-export modules deliberately use
    # ``from .x import *`` to forward submodule symbols. Could be cleaned
    # up by enumerating every name in ``__all__``; defer.
    "F403",
    "F405",
    # Bare except: 20 sites; need thoughtful per-site review (most should
    # narrow to ``Exception`` or specific types). Defer.
    "E722",
    # Line length: enforced through ``line-length = 100`` above; pycodestyle
    # E501 is too noisy across legacy files. Defer.
    "E501",
    # Unused variable. 57 sites in legacy modules; many are debug-leftovers
    # or intentional unpack-and-discard. Cleanup is per-site review work.
    "F841",
    # Unused import (when not in __init__.py — those are already ignored).
    # 20 remaining sites are mostly conditional-import patterns where the
    # name IS used inside an ``if HAS_X:`` block but ruff can't see that.
    "F401",
    # Method redefinition flagged across class boundaries — false-positive
    # shape (WorkflowConfig.validate_graph (Pydantic field) vs
    # WorkflowGraph.validate_graph (method) on a different class). Defer.
    "F811",
    # Module-level imports not at top — 4 sites use deliberate
    # late-import-after-sys.path-tweak patterns in scripts/demos.
    "E402",
    # Two-statement lines, true/false comparison, type comparison,
    # lambda-assignment. Misc legacy style; cleanup is per-site.
    "E701", "E712", "E721", "E731",
    "F402",  # import shadowed by loop var
]

[tool.ruff.lint.per-file-ignores]
# Test files commonly use unused-fixture-arg patterns + module-level
# imports for monkeypatching. Skip the noise.
"tests/**" = ["F401", "F811", "E402"]

# ``__init__.py`` modules are mostly re-export shims; F401 (unused-import
# at module top) is the deliberate shape.
"**/__init__.py" = ["F401"]

# nanobrain/cleanup/ is legacy + slated for removal. Don't gate on it.
"nanobrain/cleanup/**" = ["E", "F", "W"]

# Demo + example modules — best-effort code that doesn't enforce strictness.
"demos/**" = ["E", "F", "W"]
"nanobrain/lightweight/examples.py" = ["E", "F", "W"]
