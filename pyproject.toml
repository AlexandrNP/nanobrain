[build-system]
requires = ["setuptools>=45.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanobrain"
version = "0.1.0"
description = "Event-driven AI agent framework for distributed workflows (RESEARCH PREVIEW)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "aiofiles>=23.0.0",
    # aiohttp: library/tools/bioinformatics/bv_brc_tool.py imports this at
    # module top. Previously undeclared — module import fails on fresh install.
    # Same shape of gap as the 2026-04-21 aiofiles fix.
    "aiohttp>=3.9",
    # aiosqlite: library/__init__.py's eager workflow imports need this;
    # without it, ``import nanobrain.library`` raises ModuleNotFoundError.
    "aiosqlite>=0.19",
    "cachetools>=5.0.0",
    "psutil>=5.0.0",
    "pandas>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "requests>=2.31.0",
    # httpx: library/tools/bioinformatics/pubmed_client.py imports this for
    # async NCBI E-utils calls (Phase 4B, 2026-05-04). Previously undeclared.
    # Same shape of gap as the 2026-04-21 aiofiles + 2026-04-?? aiohttp fixes.
    "httpx>=0.25.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
llm = [
    # core/agent.py unconditionally attempts ``from openai import AsyncOpenAI``
    # at _initialize_llm_client time. Without this dep the try/except pretends
    # to silently disable LLM support, but the real failure is UnboundLocalError
    # on the logger fallback path — see scope memo 07 (apecx-mcp-integration).
    # The OpenAI client library works for both api.openai.com AND any
    # OpenAI-compatible endpoint (Ollama, vLLM, llama.cpp-server) via base_url.
    "openai>=1.0",
]
distributed = [
    "parsl>=2024.6.10",
]
academy = [
]
rag = [
    "sentence-transformers>=2.2.2,<3.0.0",
    "faiss-cpu>=1.7.4",
    "numpy>=1.24.0",
]
dev = [
    "pytest>=7.0.0",
]
all = [
    "nanobrain[llm,distributed,academy,rag,dev]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nanobrain*"]
exclude = ["tests*", "docs*", "demos*", "scripts*", "config*", "logs*", "results*"]
