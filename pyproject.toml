[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanobrain-rag"
version = "1.0.0"
description = "Production-ready RAG system using the Nanobrain framework"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Nanobrain Team", email = "team@nanobrain.ai"}
]
keywords = ["rag", "llm", "vector-database", "embeddings", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Core dependencies for production RAG system
dependencies = [
    # Core Framework
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "aiofiles>=23.0.0",
    "python-dotenv>=1.0.0",
    
    # LLM Integration
    "openai>=1.3.0,<2.0.0",
    "anthropic>=0.7.0",
    "transformers>=4.35.0,<5.0.0",
    "torch>=2.1.0,<3.0.0",
    "accelerate>=0.24.0",
    
    # Embeddings and Vector Search
    "sentence-transformers>=2.2.2,<3.0.0",
    "faiss-cpu>=1.7.4",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    
    # Document Processing
    "langchain>=0.0.350,<1.0.0",
    "langchain-community>=0.0.10",
    "unstructured>=0.11.0",
    "pypdf>=3.17.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "markdown>=3.5.0",
    
    # Text Processing
    "spacy>=3.7.0",
    "nltk>=3.8.0",
    "tiktoken>=0.5.0",
    
    # HTTP and API
    "httpx>=0.25.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    
    # Data Processing
    "pandas>=2.1.0",
    "tqdm>=4.66.0",
    
    # Logging and Monitoring
    "structlog>=23.2.0",
    
    # Data Validation
    "pydantic>=2.5.0",
    
    # Utilities
    "python-dateutil>=2.8.0",
    "click>=8.1.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
# GPU acceleration
gpu = [
    "faiss-gpu>=1.7.4",
    "cupy>=12.0.0",
]

# Additional vector databases
vector-dbs = [
    "chromadb>=0.4.0",
    "pinecone-client>=2.2.0",
    "weaviate-client>=3.25.0",
    "qdrant-client>=1.6.0",
]

# Local model support
local-models = [
    "ollama>=0.1.0",
    "llama-cpp-python>=0.2.0",
]

# Web interface
web = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "websockets>=12.0",
    "python-multipart>=0.0.6",
]

# Development tools
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.12.0",
    "black>=23.11.0",
    "flake8>=6.1.0",
    "mypy>=1.7.0",
    "memory-profiler>=0.61.0",
]

# Production deployment
prod = [
    "redis>=5.0.0",
    "celery>=5.3.0",
    "prometheus-client>=0.19.0",
    "cryptography>=41.0.0",
    "psutil>=5.9.0",
]

# All optional dependencies
all = [
    "nanobrain-rag[gpu,vector-dbs,local-models,web,dev,prod]"
]

[project.urls]
Homepage = "https://github.com/nanobrain/nanobrain-rag"
Documentation = "https://docs.nanobrain.ai/rag"
Repository = "https://github.com/nanobrain/nanobrain-rag.git"
Issues = "https://github.com/nanobrain/nanobrain-rag/issues"

[project.scripts]
nanobrain-rag = "nanobrain.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nanobrain*"]
exclude = ["tests*", "docs*", "examples*"]

[tool.setuptools.package-data]
"nanobrain" = ["**/*.yml", "**/*.yaml", "**/*.txt", "**/*.md"]

# Black code formatting
[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# Flake8 linting
[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    ".eggs",
    "*.egg",
]

# MyPy type checking
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "faiss.*",
    "sentence_transformers.*",
    "langchain.*",
    "unstructured.*",
    "chromadb.*",
    "pinecone.*",
    "weaviate.*",
    "qdrant_client.*",
]
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "gpu: marks tests that require GPU",
]
asyncio_mode = "auto"

# Coverage configuration
[tool.coverage.run]
source = ["nanobrain"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# Ruff linting and formatting (alternative to flake8/black)
[tool.ruff]
target-version = "py39"
line-length = 100
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["B011"]

[tool.ruff.isort]
known-first-party = ["nanobrain"]
