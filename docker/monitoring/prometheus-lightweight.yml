global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 10s
rule_files: null
scrape_configs:
- job_name: prometheus
  static_configs:
  - targets:
    - localhost:9090
  scrape_interval: 60s
- job_name: nanobrain-chatbot
  static_configs:
  - targets:
    - nanobrain-chatbot:5000
  metrics_path: /api/metrics
  scrape_interval: 60s
  scrape_timeout: 10s
- job_name: viral-annotation
  static_configs:
  - targets:
    - nanobrain-viral-annotation:8001
  metrics_path: /metrics
  scrape_interval: 60s
  scrape_timeout: 10s
- job_name: nginx
  static_configs:
  - targets:
    - nanobrain-nginx:80
  metrics_path: /metrics
  scrape_interval: 60s
  scrape_timeout: 5s
- job_name: postgres
  static_configs:
  - targets:
    - nanobrain-postgres:5432
  scrape_interval: 120s
  scrape_timeout: 10s
- job_name: redis
  static_configs:
  - targets:
    - nanobrain-redis:6379
  scrape_interval: 120s
  scrape_timeout: 10s
