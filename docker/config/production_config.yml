application:
  name: NanoBrain Viral Protein Analysis
  version: 4.0.0
  environment: production
  debug: false
  server:
    host: 0.0.0.0
    port: 8000
    workers: 4
    max_connections: 1000
    keepalive_timeout: 65
  security:
    allowed_hosts:
    - '*'
    cors_enabled: true
    cors_origins:
    - https://your-domain.com
    api_rate_limit: 100/hour
database:
  host: postgres
  port: 5432
  name: nanobrain
  user: nanobrain
  password: ${POSTGRES_PASSWORD}
cache:
  redis:
    host: redis
    port: 6379
    database: 0
    max_connections: 50
    socket_timeout: 5
  strategies:
    pubmed_references:
      ttl_hours: 168
      max_size_mb: 500
      compression: true
    bvbrc_data:
      ttl_hours: 72
      max_size_mb: 1000
      compression: true
    workflow_results:
      ttl_hours: 24
      max_size_mb: 200
eeev_workflow:
  data_acquisition:
    max_genomes: 100
    batch_size: 20
    timeout_seconds: 300
    retry_attempts: 3
  clustering:
    mmseqs2:
      min_seq_id: 0.7
      coverage: 0.8
      sensitivity: 7.5
      max_sequences: 1000
  literature:
    pubmed:
      max_references_per_protein: 10
      min_relevance_score: 0.5
      cache_duration_days: 7
  performance:
    max_memory_gb: 4
    max_cpu_cores: 8
    parallel_jobs: 4
external_apis:
  bvbrc:
    base_url: https://www.bv-brc.org/api
    timeout_seconds: 30
    rate_limit: 10/second
    retry_attempts: 3
    anonymous_access: true
  pubmed:
    base_url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils
    email: onarykov@anl.gov
    tool: nanobrain
    timeout_seconds: 15
    rate_limit: 3/second
    retry_attempts: 3
logging:
  level: INFO
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
monitoring:
  prometheus:
    enabled: true
    port: 8001
    path: /metrics
  health_checks:
    enabled: true
    path: /health
    database_check: true
    cache_check: true
    external_api_check: false
  metrics:
    workflow_execution_time: true
    api_response_time: true
    cache_hit_rate: true
    memory_usage: true
    error_rate: true
storage:
  data_directory: /app/data
  results_directory: /app/data/results
  cache_directory: /app/cache
  cleanup:
    enabled: true
    retain_days: 30
    max_storage_gb: 50
  backup:
    enabled: true
    schedule: 0 2 * * *
    retention_days: 7
    compression: true
security:
  jwt_secret: ${JWT_SECRET}
  session_timeout: 3600
resources:
  memory:
    workflow_max_gb: 4
    cache_max_gb: 2
    api_max_gb: 1
  cpu:
    workflow_max_cores: 8
    api_max_cores: 4
  disk:
    warning_threshold_gb: 5
    critical_threshold_gb: 2
    cleanup_threshold_gb: 1
error_handling:
  retry:
    max_attempts: 3
    backoff_multiplier: 2
    max_delay_seconds: 60
  reporting:
    enabled: true
    include_stacktrace: false
    notify_admin: true
  degradation:
    enable_partial_results: true
    cache_fallback: true
    timeout_handling: user_notification
nanobrain:
  environment: production
  debug: false
  log_level: INFO
redis:
  host: redis
  port: 6379
  db: 0
viral_annotation:
  service_port: 8001
  output_directory: /app/data
  cache_directory: /app/cache
  log_directory: /app/logs
api:
  cors_origins:
  - http://localhost:3000
  - https://localhost:3000
  - http://localhost:5000
  rate_limiting:
    enabled: true
    max_requests_per_minute: 60
