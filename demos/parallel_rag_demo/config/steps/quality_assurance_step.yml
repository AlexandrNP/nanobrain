# Quality Assurance Specialist Step Configuration (AUTOMATIC TRIGGERS)
# APECX-RAG Pipeline - Step 5: Response validation and final review

name: "quality_assurance_step"
description: "Response validation and final review using QA specialist agent"

# Agent configuration for quality assurance processing
agent_class: "nanobrain.library.workflows.rag.agents.QueryEnhancementAgent"
agent_config: "nanobrain/library/workflows/rag/config/agents/query_enhancement_agent.yml"

# AgentStep data bridging configuration
input_extraction_strategy: "auto_detect"
output_formatting_strategy: "conversational_response"
input_field_name: "synthesis_input"
input_template: "{{ synthesis_input }}"
output_template: "{{ response }}"

# Conversation management
enable_conversation_tracking: false
conversation_id_field: null
conversation_context_size: 10
conversation_timeout: 3600
max_conversation_length: 50

# Performance settings
agent_timeout: 50.0
enable_agent_caching: false
cache_ttl: 300
auto_initialize_agent: true

# Step-level data units (automatically connected via automatic triggers)
input_data_units:
  synthesis_input:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: "synthesis_input"
    description: "Synthesized response for quality assurance review"
    persistent: false

  original_query_context:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: "original_query_context"
    description: "Original query context for completeness validation"
    persistent: false

output_data_units:
  final_qa_output:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: "final_qa_output"
    description: "Final quality-assured response"
    persistent: false

# ✅ NO TRIGGER CONFIGURATION NEEDED!
# Automatic triggers handle quality assurance seamlessly

# Processing configuration
processing_config:
  enable_input_validation: true
  enable_output_formatting: true
  enable_error_recovery: true
  max_processing_time: 50
  
  qa_features:
    - "response_validation"
    - "fact_checking"
    - "completeness_review"
    - "clarity_assessment"
    - "final_optimization"

# Quality Assurance configuration
qa_config:
  enable_fact_verification: true
  enable_completeness_check: true
  enable_clarity_assessment: true
  enable_citation_validation: true
  enable_logical_consistency_check: true
  quality_standards: "high"
  certification_level: "comprehensive"
  accuracy_threshold: 0.95
  quality_threshold: 0.9

# Performance settings
performance:
  timeout: 50
  retry_attempts: 2
  enable_caching: false  # Each QA review is unique
  
# Quality assurance validation
quality_assurance:
  enable_validation: true
  min_response_length: 200
  max_response_length: 6000
  quality_threshold: 0.9
  accuracy_threshold: 0.95
  required_output_sections:
    - "QA_SUMMARY"
    - "FINAL_RESPONSE"
    - "QUALITY_CERTIFICATION"

# Final output formatting
output_formatting:
  include_qa_metadata: true
  include_confidence_scores: true
  include_source_validation: true
  format_citations: true
  optimize_readability: true

# Step-specific settings
timeout: 50
max_retries: 3
enable_fallback: true

# Monitoring
monitoring:
  enable_step_timing: true
  enable_qa_metrics: true
  track_quality_improvements: true
  log_level: "INFO"
