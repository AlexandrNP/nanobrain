name: aurora_computation_step
description: "Aurora HPC computation step"
step_name: aurora_computation
class: steps.aurora_computation_step.AuroraComputationStep

computation_type: "sequence_analysis"
aurora_nodes: 1
computation_intensity: "low"

input_data_units:
  aurora_input:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: "aurora_input"
    description: "Input data for Aurora computation"
    persistent: false

output_data_units:
  aurora_results:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: "aurora_results"
    description: "Computed results from Aurora HPC"
    persistent: false

executor:
  class: nanobrain.core.executor.ParslExecutor
  config: aurora_parsl_executor.yml
