# Retrieval Specialist Step Configuration (AUTOMATIC TRIGGERS)
# APECX-RAG Pipeline - Step 2: Specialized document retrieval and ranking

name: "retrieval_specialist_step"
description: "Specialized document retrieval and ranking using semantic search"

# Use existing semantic retrieval configuration
# No agent needed - this is a deterministic step

# Retrieval configuration
search_strategy: "hybrid"  # dense, sparse, hybrid
top_k: 20
similarity_threshold: 0.7
enable_reranking: true
reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"

# Vector database configuration
vector_db_config:
  provider: "faiss"
  index_path: "data/vector_index"
  embedding_dimension: 1536
  enable_persistence: true

# Step-level data units (automatically connected via automatic triggers)
input_data_units:
  retrieval_query:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: "retrieval_query"
    description: "Enhanced query for document retrieval"
    persistent: false

  vector_index:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: "vector_index"
    description: "Vector database reference for search"
    persistent: true

output_data_units:
  retrieved_chunks:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: "retrieved_chunks"
    description: "Retrieved and ranked document chunks"
    persistent: false

# ✅ NO TRIGGER CONFIGURATION NEEDED!
# Automatic triggers handle query processing seamlessly

# Processing configuration
processing_config:
  enable_input_validation: true
  enable_output_formatting: true
  enable_error_recovery: true
  max_processing_time: 45
  
  retrieval_features:
    - "semantic_search"
    - "keyword_matching"
    - "relevance_ranking"
    - "metadata_extraction"

# Search configuration
search_config:
  enable_semantic_search: true
  enable_keyword_search: true
  enable_hybrid_search: true
  max_passage_length: 500
  min_passage_length: 50
  enable_context_expansion: true

# Performance settings
performance:
  timeout: 45
  retry_attempts: 2
  enable_caching: true
  cache_ttl: 3600  # 1 hour
  
# Quality assurance
quality_assurance:
  enable_validation: true
  min_documents_required: 5
  max_documents_processed: 50
  relevance_threshold: 0.6
  required_output_sections:
    - "SEARCH_SUMMARY"
    - "TOP_RESULTS"
    - "KEY_PASSAGES"

# Monitoring
monitoring:
  enable_step_timing: true
  enable_search_performance: true
  track_retrieval_quality: true
  log_level: "INFO"
