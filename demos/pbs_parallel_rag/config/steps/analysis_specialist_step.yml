# Analysis Specialist Step Configuration (AUTOMATIC TRIGGERS)
# APECX-RAG Pipeline - Step 3: Deep analysis of retrieved documents and query context

name: "analysis_specialist_step"
description: "Deep analysis and reasoning using specialized analysis agent"

# Agent configuration for analysis processing
agent_class: "nanobrain.library.workflows.rag.agents.QueryEnhancementAgent"
agent_config: "nanobrain/library/workflows/rag/config/agents/query_enhancement_agent.yml"

# AgentStep data bridging configuration
input_extraction_strategy: "auto_detect"
output_formatting_strategy: "conversational_response"
input_field_name: "documents_input"
input_template: "{{ documents_input }}"
output_template: "{{ response }}"

# Conversation management
enable_conversation_tracking: false
conversation_id_field: null
conversation_context_size: 10
conversation_timeout: 3600
max_conversation_length: 50

# Performance settings
agent_timeout: 60.0
enable_agent_caching: false
cache_ttl: 300
auto_initialize_agent: true

# Step-level data units (automatically connected via automatic triggers)
input_data_units:
  documents_input:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: "documents_input"
    description: "Retrieved documents for deep analysis"
    persistent: false

  query_context:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: "query_context"
    description: "Original query context for analysis guidance"
    persistent: false

output_data_units:
  analysis_output:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: "analysis_output"
    description: "Deep analysis results and insights"
    persistent: false

# ✅ NO TRIGGER CONFIGURATION NEEDED!
# Automatic triggers handle document analysis seamlessly

# Processing configuration
processing_config:
  enable_input_validation: true
  enable_output_formatting: true
  enable_error_recovery: true
  max_processing_time: 60
  
  analysis_features:
    - "document_analysis"
    - "pattern_recognition"
    - "evidence_evaluation"
    - "insight_extraction"
    - "contradiction_detection"

# Analysis configuration
analysis_config:
  enable_fact_checking: true
  enable_source_validation: true
  enable_pattern_recognition: true
  enable_contradiction_detection: true
  analysis_depth: "comprehensive"
  reasoning_approach: "critical_thinking"
  confidence_assessment: true

# Performance settings
performance:
  timeout: 60
  retry_attempts: 2
  enable_caching: false  # Analysis should be fresh
  
# Quality assurance
quality_assurance:
  enable_validation: true
  min_analysis_depth: 0.8
  confidence_threshold: 0.7
  required_output_sections:
    - "ANALYSIS_SUMMARY"
    - "KEY_INSIGHTS"
    - "EVIDENCE_QUALITY"
    - "CONFIDENCE_ASSESSMENT"

# Step-specific settings
timeout: 60
max_retries: 3
enable_fallback: true

# Monitoring
monitoring:
  enable_step_timing: true
  enable_analysis_quality: true
  track_insight_generation: true
  log_level: "INFO"
