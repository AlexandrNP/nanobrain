# Prompt Enhancement Step Configuration with PARSL Parallel Execution
# PARALLEL RAG Pipeline - Step 1: Query optimization with parallel processing
# Uses custom ParallelQueryEnhancementStep class with built-in PARSL executor

name: "prompt_enhancement_step"
description: "Query optimization with PARSL parallel execution for multiple queries"

# Agent configuration for the step
agent_class: "nanobrain.library.workflows.rag.agents.QueryEnhancementAgent"
agent_config: "nanobrain/library/workflows/rag/config/agents/query_enhancement_agent.yml"

# PARSL executor configuration for MPI execution
executor_config_path: "config/executors/pbs_executor.yml"

# AgentStep data bridging configuration
input_extraction_strategy: "auto_detect"
output_formatting_strategy: "conversational_response"
input_field_name: "user_query"
input_template: "{{ user_query }}"
output_template: "{{ response }}"

# Conversation management
enable_conversation_tracking: false
conversation_id_field: null
conversation_context_size: 10
conversation_timeout: 3600
max_conversation_length: 50

# Step-level data units (automatically connected via automatic triggers)
input_data_units:
  query_input:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: "query_input"
    description: "Raw user query input for enhancement"
    persistent: false

output_data_units:
  enhanced_query:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: "enhanced_query"
    description: "Enhanced and optimized query with context"
    persistent: false

# Processing configuration
processing_config:
  enable_input_validation: true
  enable_output_formatting: true
  enable_error_recovery: true
  max_processing_time: 30
  
  # Parallel processing settings
  enable_parallel_processing: true
  max_parallel_tasks: 4
  
  enhancement_features:
    - "query_analysis"
    - "context_enrichment"
    - "keyword_expansion"
    - "search_optimization"

# Performance settings
agent_timeout: 30.0
enable_agent_caching: false
cache_ttl: 300
auto_initialize_agent: true
timeout: 30
max_retries: 3
enable_fallback: true
  
# Quality assurance
quality_assurance:
  enable_validation: true
  min_enhancement_quality: 0.7
  required_output_sections:
    - "ENHANCED_QUERY"
    - "SEARCH_TERMS"
    - "CONTEXT"

# Monitoring
monitoring:
  enable_step_timing: true
  enable_agent_performance: true
  track_enhancement_quality: true
  track_parallel_performance: true
  log_level: "INFO"

