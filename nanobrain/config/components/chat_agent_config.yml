# Chat Agent Configuration for NanoBrain Framework
# Provides configuration for enhanced collaborative agent

name: "chat_agent"
description: "Enhanced collaborative agent for chat workflows"
version: "1.0.0"

# Agent configuration
class: "nanobrain.library.agents.enhanced_collaborative_agent.EnhancedCollaborativeAgent"

# LLM configuration
llm_config:
  model: "gpt-3.5-turbo"
  temperature: 0.7
  max_tokens: 2000
  timeout: 30.0

# Agent behavior
agent_config:
  system_prompt: "You are a helpful and friendly AI assistant with enhanced capabilities."
  enable_metrics: true
  enable_conversation_history: true
  max_conversation_length: 50

# Performance settings
performance:
  response_timeout: 30.0
  enable_caching: true
  cache_size: 100

# Logging configuration
logging:
  enable_agent_logging: true
  log_level: "INFO"
  log_conversations: false
