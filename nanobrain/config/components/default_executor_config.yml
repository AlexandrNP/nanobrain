# Default Executor Configuration for NanoBrain Framework
# CRITICAL FIX: Provides missing executor_type configuration

name: "default_local_executor"
description: "Default local executor for NanoBrain workflows"
version: "1.0.0"

# CRITICAL: executor_type field that was missing
executor_type: "local"

# Executor configuration
class: "nanobrain.core.executor.LocalExecutor"
max_workers: 4
timeout: 300.0
enable_monitoring: true
debug_mode: false

# Performance settings
performance:
  max_concurrent_tasks: 10
  task_timeout: 60.0
  retry_attempts: 3
  retry_delay: 1.0

# Logging configuration
logging:
  enable_task_logging: true
  log_level: "INFO"
  log_performance_metrics: true
