mcp:
  client:
    default_timeout: 30.0
    default_max_retries: 3
    default_retry_delay: 1.0
    connection_pool_size: 10
    enable_tool_caching: true
    tool_cache_ttl: 300
    auto_discover_tools: true
    fail_on_server_error: false
    log_tool_calls: true
  servers:
  - name: demo_server
    url: mock://demo.example.com/mcp
    description: Demo MCP server for testing
    auth_type: none
    enabled: true
    timeout: 30.0
    max_retries: 3
    retry_delay: 1.0
    capabilities:
    - tools
  - name: authenticated_server
    url: https://api.example.com/mcp
    description: Production MCP server with authentication
    auth_type: bearer
    auth_token: ${MCP_AUTH_TOKEN}
    enabled: true
    timeout: 45.0
    max_retries: 5
    retry_delay: 2.0
    capabilities:
    - tools
    - resources
  - name: oauth_server
    url: https://oauth.example.com/mcp
    description: MCP server with OAuth authentication
    auth_type: oauth
    oauth_config:
      client_id: ${OAUTH_CLIENT_ID}
      client_secret: ${OAUTH_CLIENT_SECRET}
      scope: mcp:tools mcp:resources
      token_url: https://oauth.example.com/token
    enabled: false
    timeout: 60.0
    max_retries: 3
    retry_delay: 1.5
    capabilities:
    - tools
    - resources
    - prompts
  - name: local_dev
    url: http://localhost:8080/mcp
    description: Local development MCP server
    auth_type: none
    enabled: false
    timeout: 10.0
    max_retries: 1
    retry_delay: 0.5
    capabilities:
    - tools
