framework:
  name: NanoBrain
  version: 1.0.0
  description: Event-driven AI workflow framework
api_keys:
  openai:
    api_key: ''
    organization: ${OPENAI_ORG_ID}
    base_url: https://api.openai.com/v1
  anthropic:
    api_key: ${ANTHROPIC_API_KEY}
    base_url: https://api.anthropic.com
  google:
    api_key: ${GOOGLE_AI_API_KEY}
    project_id: ${GOOGLE_PROJECT_ID}
    base_url: https://generativelanguage.googleapis.com
  azure_openai:
    api_key: ${AZURE_OPENAI_API_KEY}
    endpoint: ${AZURE_OPENAI_ENDPOINT}
    api_version: 2024-02-15-preview
  cohere:
    api_key: ${COHERE_API_KEY}
    base_url: https://api.cohere.ai
  huggingface:
    api_key: ${HUGGINGFACE_API_KEY}
    base_url: https://api-inference.huggingface.co
  replicate:
    api_key: ${REPLICATE_API_TOKEN}
    base_url: https://api.replicate.com
  together:
    api_key: ${TOGETHER_API_KEY}
    base_url: https://api.together.xyz
  mistral:
    api_key: ${MISTRAL_API_KEY}
    base_url: https://api.mistral.ai
default_models:
  text_generation:
    openai: gpt-4
    anthropic: claude-3-sonnet-20240229
    google: gemini-pro
    azure_openai: gpt-4
    cohere: command-r-plus
    mistral: mistral-large-latest
  chat:
    openai: gpt-3.5-turbo
    anthropic: claude-3-haiku-20240307
    google: gemini-pro
    azure_openai: gpt-35-turbo
  embeddings:
    openai: text-embedding-3-small
    cohere: embed-english-v3.0
    huggingface: sentence-transformers/all-MiniLM-L6-v2
  image_generation:
    openai: dall-e-3
    replicate: stability-ai/stable-diffusion
  code_generation:
    openai: gpt-4
    anthropic: claude-3-sonnet-20240229
    together: codellama/CodeLlama-34b-Instruct-hf
providers:
  openai:
    timeout: 60
    max_retries: 3
    retry_delay: 1.0
  anthropic:
    timeout: 60
    max_retries: 3
    retry_delay: 1.0
    max_tokens: 32000
  google:
    timeout: 60
    max_retries: 3
    retry_delay: 1.0
  azure_openai:
    timeout: 60
    max_retries: 3
    retry_delay: 1.0
  cohere:
    timeout: 60
    max_retries: 3
    retry_delay: 1.0
  huggingface:
    timeout: 120
    max_retries: 3
    retry_delay: 2.0
  replicate:
    timeout: 300
    max_retries: 3
    retry_delay: 5.0
  together:
    timeout: 60
    max_retries: 3
    retry_delay: 1.0
  mistral:
    timeout: 60
    max_retries: 3
    retry_delay: 1.0
env_mappings:
  openai:
  - OPENAI_API_KEY
  - OPENAI_ORG_ID
  - OPENAI_BASE_URL
  anthropic:
  - ANTHROPIC_API_KEY
  - ANTHROPIC_BASE_URL
  google:
  - GOOGLE_AI_API_KEY
  - GOOGLE_PROJECT_ID
  - GOOGLE_APPLICATION_CREDENTIALS
  azure_openai:
  - AZURE_OPENAI_API_KEY
  - AZURE_OPENAI_ENDPOINT
  - AZURE_OPENAI_API_VERSION
  cohere:
  - COHERE_API_KEY
  - COHERE_BASE_URL
  huggingface:
  - HUGGINGFACE_API_KEY
  - HUGGINGFACE_BASE_URL
  replicate:
  - REPLICATE_API_TOKEN
  - REPLICATE_BASE_URL
  together:
  - TOGETHER_API_KEY
  - TOGETHER_BASE_URL
  mistral:
  - MISTRAL_API_KEY
  - MISTRAL_BASE_URL
security:
  validate_keys_on_startup: false
  log_key_validation: true
  require_valid_key: false
  mask_keys_in_logs: true
logging:
  mode: file
  level: INFO
  log_config_loading: true
  log_env_loading: false
  log_missing_keys: true
  file:
    base_directory: logs
    use_session_directories: true
    max_file_size_mb: 10
    backup_count: 5
    compress_old_logs: true
  console:
    use_colors: true
    show_timestamps: true
    format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
development:
  # DEFAULT FLIPPED 2026-04-23 (T14 mocks-policy enforcement):
  # Previously ``true``, which caused every shipped nanobrain
  # deployment to run with mock LLM / A2A / Academy clients by
  # default. That's a production-path mock fallback per the
  # workspace 2026-04-21 mocks policy. Setting to ``false`` means
  # production deployments use real clients and fail-loud when they
  # can't. Operators who genuinely want the old mock-client behavior
  # for local demos must now opt in explicitly.
  use_mock_clients: false
  validate_schema: true
  allow_env_override: true
