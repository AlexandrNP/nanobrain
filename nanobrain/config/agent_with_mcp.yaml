agent:
  name: mcp_enabled_agent
  description: Conversational agent with MCP tool support
  model: gpt-4
  temperature: 0.7
  max_tokens: 2000
  system_prompt: 'You are a helpful AI assistant with access to external tools through MCP (Model Context Protocol).

    You can use various tools to help users with calculations, weather information, and other tasks.

    Always explain what tools you''re using and why.

    '
  tools:
    enabled: true
    max_parallel_calls: 3
    timeout: 30.0
  mcp:
    config_path: mcp_config.yaml
    client_overrides:
      auto_discover_tools: true
      fail_on_server_error: false
      log_tool_calls: true
    server_overrides:
      demo_server:
        enabled: true
      authenticated_server:
        enabled: false
      local_dev:
        enabled: true
workflow:
  name: mcp_chat_workflow
  description: Chat workflow with MCP tool support
  data_units:
  - name: user_input
    class: nanobrain.core.data_unit.DataUnitMemory
    description: User input messages
  - name: agent_responses
    class: nanobrain.core.data_unit.DataUnitMemory
    description: Agent responses with tool usage
  steps:
  - name: mcp_agent_step
    type: conversational_agent
    agent_config_ref: agent
  triggers:
  - name: user_message_trigger
    type: data_updated
    data_unit: user_input
  links:
  - from: user_input
    to: mcp_agent_step
    type: direct
  - from: mcp_agent_step
    to: agent_responses
    type: direct
