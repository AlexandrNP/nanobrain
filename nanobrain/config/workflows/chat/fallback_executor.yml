name: fallback_chat_executor
description: Fallback local executor for chat workflows
version: 1.0.0
executor_type: local
class: nanobrain.core.executor.LocalExecutor
max_workers: 2
timeout: 120.0
enable_monitoring: false
debug_mode: true
performance:
  max_concurrent_tasks: 5
  task_timeout: 30.0
  retry_attempts: 2
  retry_delay: 0.5
logging:
  enable_task_logging: true
  log_level: DEBUG
  log_performance_metrics: false
