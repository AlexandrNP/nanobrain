name: virus_resolution_agent
description: Agent for resolving virus species to canonical ICTV taxonomy
class: nanobrain.library.agents.specialized.simple_specialized_agent.SimpleSpecializedAgent
model: gpt-4
temperature: 0.1
max_tokens: 200
timeout: 30
agent_card:
  version: 1.0.0
  purpose: Virus species resolution to canonical ICTV taxonomy
  detailed_description: Specialized agent for resolving virus species names to canonical ICTV taxonomy with BV-BRC search
    terms
  domain: bioinformatics
  expertise_level: expert
  input_format:
    primary_mode: text
    supported_modes:
    - text
    content_types:
    - text/plain
  output_format:
    primary_mode: json
    supported_modes:
    - json
    content_types:
    - application/json
  capabilities:
    streaming: false
    multi_turn_conversation: false
    context_retention: false
    tool_usage: false
system_prompt: "Resolve the following virus species to its canonical ICTV taxonomy name:\n\nVirus: \"{virus_species}\"\n\n\
  Return JSON format:\n{{\n  \"resolved_species\": \"canonical ICTV species name\",\n  \"confidence\": 0.0-1.0,\n  \"taxonomy_info\"\
  : {{\n    \"genus\": \"genus name\",\n    \"family\": \"family name\"\n  }},\n  \"synonyms\": [\"list of known synonyms\"\
  ],\n  \"bvbrc_search_terms\": [\"list of BV-BRC compatible search terms\"]\n}}\n\nReturn only the JSON response.\n"
specialization:
  domain: virology
  expertise: virus_taxonomy
  accuracy_threshold: 0.9
  confidence_reporting: true
  ictv_compliance: true
cache_config:
  enable_caching: true
  cache_ttl_hours: 24
  virus_specific: true
