agent_type: specialized_agent
name: virus_extraction_agent
description: Specialized agent for extracting and analyzing virus-related information from natural language queries
version: 1.0.0
specialization_domain: virology
llm_config:
  provider: openai
  model: gpt-4o-mini
  temperature: 0.0
  max_tokens: 50
  top_p: 1.0
  frequency_penalty: 0.0
  presence_penalty: 0.0
  api_config:
    timeout: 30
    max_retries: 3
    retry_delay: 1.0
specialization:
  domain: virology
  expertise_areas:
  - alphavirus
  - viral_proteins
  - virus_classification
  - viral_pathogenesis
  - viral_evolution
  - viral_structure
  analysis_patterns:
  - virus_detection
  - protein_extraction
  - viral_family_classification
  - pathogen_identification
  - species_recognition
  virus_families:
  - Togaviridae
  - Flaviviridae
  - Coronaviridae
  - Orthomyxoviridae
  - Paramyxoviridae
  - Picornaviridae
  target_viruses:
  - Eastern Equine Encephalitis Virus
  - Chikungunya Virus
  - Zika Virus
  - Dengue Virus
  - SARS-CoV-2
  - Influenza A
  - Alphaviruses
capabilities:
  virus_identification:
    enabled: true
    confidence_threshold: 0.8
    fuzzy_matching: true
    synonym_resolution: true
  protein_extraction:
    enabled: true
    target_proteins:
    - envelope proteins
    - capsid proteins
    - non-structural proteins
    - spike proteins
    - polymerase proteins
  species_classification:
    enabled: true
    taxonomic_levels:
    - family
    - genus
    - species
    - strain
  pathogenesis_analysis:
    enabled: true
    focus_areas:
    - transmission mechanisms
    - host cell entry
    - replication cycle
    - immune evasion
query_processing:
  virus_detection_patterns:
    primary_patterns:
    - (?i)\b(eastern equine encephalitis|eeev)\b
    - (?i)\b(chikungunya|chikv)\b
    - (?i)\b(zika|zikv)\b
    - (?i)\b(dengue|denv)\b
    - (?i)\b(alphavirus|togavirus)\b
    - (?i)\b(sars-cov-2|covid-19|coronavirus)\b
    scientific_patterns:
    - (?i)\b[A-Z][a-z]+ virus\b
    - (?i)\b[A-Z]{2,5}V\b
    - (?i)\btogaviridae\b
    - (?i)\bflaviviridae\b
    context_patterns:
    - (?i)\b(viral|virus|pathogen|infection)\b
    - (?i)\b(encephalitis|fever|disease)\b
    - (?i)\b(epidemic|pandemic|outbreak)\b
  extraction_rules:
    min_confidence: 0.6
    max_candidates: 5
    enable_fuzzy_matching: true
    context_window: 50
system_prompt: 'Extract virus name. Return only this JSON format:

  {"virus_species": "virus name or null"}


  Never return anything else. Only JSON.

  '
extraction_prompt_template: 'Text: "{user_query}"


  Find virus name. Return JSON:

  {{"virus_species": "Eastern Equine Encephalitis virus"}}


  Your JSON:

  '
output_format:
  response_structure:
    identified_viruses:
      type: list
      fields:
      - virus_name
      - scientific_name
      - family
      - genus
      - confidence_score
      - synonyms
    extracted_proteins:
      type: list
      fields:
      - protein_name
      - protein_type
      - function
      - confidence_score
    metadata:
      type: object
      fields:
      - query_type
      - processing_time
      - confidence_threshold
      - total_candidates
performance:
  enable_caching: true
  cache_ttl: 1800
  max_concurrent_requests: 10
  request_timeout: 15
  optimization:
    enable_parallel_processing: false
    batch_processing: false
    memory_optimization: true
error_handling:
  graceful_degradation: true
  fallback_strategies:
  - basic_pattern_matching
  - keyword_extraction
  - context_analysis
  retry_policy:
    max_attempts: 3
    backoff_factor: 2.0
    timeout_multiplier: 1.5
monitoring:
  enable_performance_tracking: true
  track_extraction_accuracy: true
  track_response_times: true
  track_confidence_scores: true
  logging:
    level: INFO
    include_queries: false
    include_responses: true
    include_performance_metrics: true
