prompts:
  ictv_inference:
    template: "Based on the International Committee on Taxonomy of Viruses (ICTV) standards,\nidentify the standardized protein\
      \ nomenclature for ${genus} viruses,\nspecifically ${species}.\n\nVirus Information:\n- Genus: ${genus}\n- Species:\
      \ ${species}\n- Strain: ${strain}\n\nSample protein products from this dataset:\n${product_sample}\n\nPlease provide\
      \ the ICTV standard nomenclature mapping for this virus, including:\n1. Nonstructural proteins (e.g., nsP1 -> nonstructural\
      \ protein 1)\n2. Structural proteins (e.g., E1 -> envelope protein E1)\n3. Polyproteins (e.g., P1234 -> nonstructural\
      \ polyprotein P1234)\n4. Any virus-specific proteins\n\nReturn JSON format:\n{\n    \"ictv_standards\": {\n        \"\
      abbreviated_form\": \"full_ictv_name\",\n        \"nsP1\": \"nonstructural protein 1\",\n        ...\n    },\n    \"\
      virus_specific_notes\": \"any special considerations for this virus\",\n    \"confidence\": \"high/medium/low\"\n}\n"
    description: Infer ICTV standards for a specific virus
    required_params:
    - genus
    - species
    - strain
    - product_sample
  key_term_extraction:
    template: "Extract key protein identifiers from these product names:\n\n${products}\n\n${ictv_context}\n\nFor each product,\
      \ identify:\n1. Core protein identifier (E1, nsP1, capsid, etc.)\n2. Type (structural/nonstructural/enzyme/glycoprotein)\n\
      3. Any numeric identifiers\n4. Whether it's a fragment, domain, or full protein\n5. If it matches an ICTV standard form\n\
      \nReturn JSON format:\n{\n    \"product_analysis\": [\n        {\n            \"product\": \"original name\",\n    \
      \        \"core_id\": \"E1\",\n            \"type\": \"glycoprotein\",\n            \"is_fragment\": false,\n      \
      \      \"ictv_match\": \"envelope protein E1\",\n            \"key_terms\": [\"E1\", \"envelope\", \"glycoprotein\"\
      ]\n        }\n    ]\n}\n"
    description: Extract key protein terms from product names
    required_params:
    - products
    optional_params:
    - ictv_context
  global_synonym_analysis:
    template: "Analyze these protein product names and identify ALL synonyms across the entire list:\n\n${grouped_products}\n\
      \n${ictv_context}\n\nInstructions:\n1. Identify ALL synonym relationships, even between products in different groups\n\
      2. Use the virus-specific ICTV standard nomenclature as canonical names when applicable\n3. Consider these patterns:\n\
      \   - Abbreviations (E1 = E1 envelope glycoprotein = envelope protein E1)\n   - Alternative names (nsP1 = nsp1 = nonstructural\
      \ protein 1)\n   - Order variations (E2 glycoprotein = glycoprotein E2)\n   - Partial names (capsid = capsid protein\
      \ = structural protein C)\n   - Putative/predicted prefixes\n   - Fragment/domain relationships\n   - Virus-specific\
      \ naming conventions\n\n4. For each synonym group:\n   - Select the ICTV standard name if available\n   - Otherwise,\
      \ select the most complete/descriptive name\n   - Include confidence scores (0-1) for each relationship\n\nReturn JSON\
      \ format:\n{\n    \"synonym_groups\": [\n        {\n            \"canonical\": \"ICTV standard or most complete name\"\
      ,\n            \"ictv_standard\": true/false,\n            \"synonyms\": [\n                {\"name\": \"synonym1\"\
      , \"confidence\": 0.95, \"reason\": \"ICTV abbreviation\"},\n                {\"name\": \"synonym2\", \"confidence\"\
      : 0.85, \"reason\": \"alternative name\"}\n            ]\n        }\n    ],\n    \"cross_references\": [\n        {\n\
      \            \"name1\": \"product from group A\",\n            \"name2\": \"product from group B\", \n            \"\
      confidence\": 0.8,\n            \"reason\": \"partial name match\"\n        }\n    ]\n}\n"
    description: Identify synonyms across all products
    required_params:
    - grouped_products
    optional_params:
    - ictv_context
  cross_reference_analysis:
    template: "Analyze these protein groups for potential cross-group relationships:\n\n${group_samples}\n\nLook for:\n1.\
      \ Polyprotein relationships (P1234 contains nsP1, nsP2, nsP3, nsP4)\n2. Fragment relationships (E1 N-terminal is part\
      \ of E1)\n3. Alternative classification schemes\n4. Misclassified proteins\n\nReturn potential cross-references with\
      \ confidence scores in JSON format:\n{\n    \"cross_references\": [\n        {\n            \"group1\": \"protein_group_name\"\
      ,\n            \"group2\": \"related_group_name\",\n            \"relationship\": \"contains|part_of|alternative_name\"\
      ,\n            \"confidence\": 0.85,\n            \"explanation\": \"reason for relationship\"\n        }\n    ]\n}\n"
    description: Find relationships between protein groups
    required_params:
    - group_samples
contexts:
  ictv_standards_context:
    template: 'Use these virus-specific ICTV standard names:

      ${ictv_standards}

      '
    description: ICTV standards context for prompts
  no_ictv_context:
    template: "Note: ICTV standards for this virus are not available. \nUse best judgment for canonical naming based on completeness\
      \ and clarity.\n"
    description: Fallback when ICTV standards not available
version: 1.0.0
description: Prompt templates for protein synonym identification agent
