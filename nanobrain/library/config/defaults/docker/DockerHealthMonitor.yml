component_name: docker_health_monitor
enabled: true
docker_client: null
check_interval: 30
auto_cleanup: true
docker_manager: null
alert_thresholds:
  cpu_threshold: 80.0
  memory_threshold: 85.0
  consecutive_failures: 3
  network_io_threshold: 104857600
  disk_io_threshold: 52428800
history_limit: 100
health_checks:
  http:
    enabled: true
    default_path: /health
    default_port: 8080
    timeout: 10
    expected_status_codes:
    - 200
    - 204
    follow_redirects: false
  tcp:
    enabled: true
    timeout: 5
  exec:
    enabled: true
    timeout: 30
    shell: /bin/sh
container_monitoring:
  resource_monitoring: true
  log_monitoring: false
  restart_monitoring: true
  network_monitoring: true
alerting:
  enabled: true
  channels:
    log: true
    webhook: false
    email: false
  severity_levels:
    critical:
    - consecutive_failures
    - container_down
    warning:
    - cpu_threshold
    - memory_threshold
    info:
    - container_restart
    - health_check_recovered
monitoring_intervals:
  resource_metrics: 15
  health_checks: 30
  log_analysis: 60
  alert_evaluation: 10
data_retention:
  health_results: 7
  resource_metrics: 3
  alert_history: 14
performance:
  max_concurrent_checks: 10
  slow_container_multiplier: 2.0
  batch_size: 5
labels:
  nanobrain.framework: 'true'
  nanobrain.component: docker-infrastructure
  nanobrain.component.name: docker_health_monitor
  nanobrain.component.type: docker-infrastructure
  nanobrain.monitoring.type: health
framework_integration:
  use_nanobrain_logging: true
  use_nanobrain_metrics: true
  generate_a2a_cards: false
tool_card:
  name: DockerHealthMonitor
  description: Comprehensive health monitoring for Docker containers in NanoBrain framework
  version: 1.0.0
  category: infrastructure
  capabilities:
  - container_health_monitoring
  - resource_usage_tracking
  - alert_notifications
  - health_history_tracking
  requirements:
  - docker_daemon
  - docker_manager
  supported_platforms:
  - linux
  - darwin
  - windows
  configuration_schema:
    type: DockerHealthMonitorConfig
    required_fields:
    - docker_manager
    optional_fields:
    - check_interval
    - alert_thresholds
    - history_limit
  usage_examples:
  - description: Basic health monitoring setup
    config:
      component_name: basic_health_monitor
      docker_manager: '{{ docker_manager_instance }}'
      check_interval: 30
  - description: Production health monitoring with custom thresholds
    config:
      component_name: prod_health_monitor
      docker_manager: '{{ docker_manager_instance }}'
      check_interval: 15
      alert_thresholds:
        cpu_threshold: 70.0
        memory_threshold: 80.0
        consecutive_failures: 2
  - description: Development health monitoring with extended history
    config:
      component_name: dev_health_monitor
      docker_manager: '{{ docker_manager_instance }}'
      history_limit: 200
      alerting:
        enabled: false
