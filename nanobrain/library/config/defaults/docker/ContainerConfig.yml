name: nanobrain-container
enabled: true
image: alpine
tag: latest
ports: []
networks: []
hostname: null
environment: null
volumes: []
working_dir: null
user: null
restart_policy: unless-stopped
health_check:
  type: http
  path: /health
  port: 8080
  interval: 30
  timeout: 10
  retries: 3
  start_period: 60
  failure_threshold: 3
  success_threshold: 1
  command: null
resource_limits:
  memory: null
  cpu: null
  memory_request: null
  cpu_request: null
  mem_limit: null
  cpu_quota: null
  cpu_period: null
labels:
  app: nanobrain-container
  nanobrain.framework: 'true'
  nanobrain.version: 1.0.0
annotations: {}
namespace: default
replicas: 1
service_type: ClusterIP
ingress_enabled: false
ingress_host: null
persistent_volume_claims: []
node_selector: {}
tolerations: []
affinity: null
auto_scaling_enabled: false
min_replicas: 1
max_replicas: 5
target_cpu_utilization: 70
target_memory_utilization: 80
security_context: {}
orchestrator: docker
docker_config:
  runtime: runc
  privileged: false
  read_only: false
  tmpfs: {}
  devices: []
  cap_add: []
  cap_drop:
  - ALL
  security_opt: []
  dns: []
  dns_search: []
  extra_hosts: []
kubernetes_config:
  pod_security_context:
    run_as_user: 1000
    run_as_group: 1000
    fs_group: 1000
  container_security_context:
    allow_privilege_escalation: false
    read_only_root_filesystem: true
    run_as_non_root: true
  service_account: default
  image_pull_secrets: []
compose_config:
  version: '3.8'
  depends_on: []
  build:
    context: null
    dockerfile: null
    args: {}
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'
lifecycle:
  pre_start:
    enabled: false
    command: []
    timeout: 30
  post_start:
    enabled: false
    command: []
    timeout: 30
  pre_stop:
    enabled: false
    command: []
    timeout: 30
monitoring:
  metrics_enabled: false
  metrics_port: 9090
  metrics_path: /metrics
  logging_enabled: true
  log_level: info
  tracing_enabled: false
environment_settings:
  type: development
  debug: false
  hot_reload: false
  dev_tools_enabled: false
framework_integration:
  nanobrain_integration: true
  generate_a2a_cards: false
  service_mesh: false
  istio_injection: false
tool_card:
  name: ContainerConfig
  description: Universal container configuration supporting multiple orchestrators in NanoBrain framework
  version: 1.0.0
  category: infrastructure
  capabilities:
  - multi_orchestrator_support
  - container_configuration
  - resource_management
  - health_checking
  - security_configuration
  requirements: []
  supported_platforms:
  - linux
  - darwin
  - windows
  supported_orchestrators:
  - docker
  - kubernetes
  - docker-compose
  - docker-swarm
  configuration_schema:
    type: ContainerConfig
    required_fields:
    - name
    - image
    optional_fields:
    - tag
    - ports
    - environment
    - volumes
    - restart_policy
    - health_check
    - resource_limits
  usage_examples:
  - description: Basic web application container
    config:
      name: webapp
      image: nginx
      tag: alpine
      ports:
      - 80:80
      environment:
        nginx_host: localhost
  - description: Database container with persistent storage
    config:
      name: database
      image: postgres
      tag: '13'
      environment:
        postgres_db: myapp
        postgres_user: user
        postgres_password: password
      volumes:
      - postgres_data:/var/lib/postgresql/data
      health_check:
        type: exec
        command:
        - pg_isready
        - -U
        - user
  - description: Microservice with resource limits and health checks
    config:
      name: api-service
      image: myapp/api
      tag: v1.0.0
      ports:
      - 8080:8080
      resource_limits:
        memory: 512Mi
        cpu: 500m
      health_check:
        type: http
        path: /health
        port: 8080
        interval: 30
