component_name: docker_volume_manager
enabled: true
docker_client: null
check_interval: 30
auto_cleanup: true
backup_dir: null
auto_backup_enabled: true
default_retention_days: 30
volume_defaults:
  driver: local
  driver_opts: {}
  labels:
    nanobrain.framework: 'true'
    nanobrain.volume.managed: 'true'
  backup_enabled: true
  backup_schedule: 0 2 * * *
  retention_days: 30
backup_settings:
  compression: gzip
  naming_pattern: '{volume_name}_{timestamp}.tar.{compression}'
  max_concurrent_backups: 3
  verify_backups: true
  incremental_backups: false
  encryption_enabled: false
storage_management:
  usage_monitoring: true
  space_thresholds:
    warning: 80
    critical: 90
  cleanup_policies:
    cleanup_old_backups: true
    cleanup_unused_volumes: false
    unused_volume_threshold: 7
volume_types:
  persistent:
    driver: local
    backup_enabled: true
    retention_days: 90
  temporary:
    driver: local
    backup_enabled: false
    retention_days: 1
  config:
    driver: local
    backup_enabled: true
    retention_days: 60
  logs:
    driver: local
    backup_enabled: false
    retention_days: 14
migration:
  enabled: false
  strategies:
    copy: true
    move: false
    sync: false
  verify_migration: true
performance:
  io_optimization:
    direct_io: false
    buffer_size: 64k
    parallel_operations: 4
  preallocation:
    enabled: false
    default_size: 1G
security:
  permissions:
    default_uid: 1000
    default_gid: 1000
    default_mode: '0755'
  encryption:
    enabled: false
    algorithm: aes-256-cbc
    key_management: local
monitoring:
  usage_monitoring: true
  performance_monitoring: false
  health_monitoring: true
  alert_thresholds:
    disk_usage: 85
    io_error_rate: 0.01
    backup_failures: 3
labels:
  nanobrain.framework: 'true'
  nanobrain.component: docker-infrastructure
  nanobrain.component.name: docker_volume_manager
  nanobrain.component.type: docker-infrastructure
  nanobrain.volume.managed: 'true'
framework_integration:
  use_nanobrain_logging: true
  generate_a2a_cards: false
  backup_service_integration: false
environment:
  type: development
  debug_logging: false
  create_dev_volumes: true
  skip_backup_in_dev: true
external_storage:
  cloud_providers:
    s3:
      enabled: false
      bucket: null
      region: us-east-1
      access_key: null
      secret_key: null
    gcs:
      enabled: false
      bucket: null
      project_id: null
      credentials_file: null
    azure:
      enabled: false
      account_name: null
      account_key: null
      container: null
tool_card:
  name: DockerVolumeManager
  description: Docker volume management for persistent storage and data operations in NanoBrain framework
  version: 1.0.0
  category: infrastructure
  capabilities:
  - volume_creation_management
  - data_backup_restore
  - volume_sharing
  - cleanup_maintenance
  - storage_monitoring
  requirements:
  - docker_daemon
  supported_platforms:
  - linux
  - darwin
  - windows
  configuration_schema:
    type: DockerVolumeManagerConfig
    required_fields: []
    optional_fields:
    - docker_client
    - backup_dir
    - auto_backup_enabled
    - default_retention_days
  usage_examples:
  - description: Basic volume management setup
    config:
      component_name: basic_volume_manager
      auto_backup_enabled: true
      default_retention_days: 30
  - description: Production volume management with custom backup directory
    config:
      component_name: prod_volume_manager
      backup_dir: /var/backups/nanobrain/volumes
      auto_backup_enabled: true
      default_retention_days: 90
      backup_settings:
        compression: bzip2
        verify_backups: true
  - description: Development volume management without backups
    config:
      component_name: dev_volume_manager
      auto_backup_enabled: false
      environment:
        type: development
        skip_backup_in_dev: true
