agent_id: query_analysis_agent
agent_name: Query Analysis Agent
agent_description: Specialized LLM agent for comprehensive natural language query analysis and intent classification
agent_version: 1.2.0
agent_type: specialized_analysis
base_class: nanobrain.library.agents.specialized.query_analysis_agent.QueryAnalysisAgent
llm_config:
  model_name: gpt-3.5-turbo
  temperature: 0.2
  max_tokens: 600
  response_format: json
specialization_config:
  analysis_domain: general_query_analysis
  analysis_focus: intent_classification_and_routing
  confidence_reporting: true
  query_analysis:
    enable_intent_detection: true
    enable_domain_classification: true
    enable_complexity_assessment: true
    enable_context_extraction: true
    confidence_threshold: 0.3
  output_format:
    format_type: structured_json
    required_fields:
    - intent
    - domain
    - complexity
    - confidence
    - routing_recommendation
    - reasoning
    include_metadata: true
prompt_templates:
  system_prompt: "You are a specialized query analysis agent. Your role is to analyze user queries \nto determine intent,\
    \ domain, complexity, and provide routing recommendations.\n\nKey responsibilities:\n1. Classify the intent (analysis,\
    \ information, conversation, action)\n2. Determine the domain (scientific, general, technical, conversational)\n3. Assess\
    \ query complexity (simple, moderate, complex)\n4. Recommend routing strategy\n5. Provide confidence assessment and reasoning\n\
    \nAlways respond in valid JSON format with the required fields.\n"
  analysis_prompt: "Analyze the following user query comprehensively:\n\nQuery: {user_query}\n\nProvide analysis for:\n1.\
    \ Intent classification (analysis/information/conversation/action)\n2. Domain identification (scientific/general/technical/conversational)\n\
    3. Complexity assessment (simple/moderate/complex)\n4. Routing recommendation (specialized_analysis/conversational/hybrid)\n\
    5. Confidence level (0.0 to 1.0)\n6. Detailed reasoning\n\nRespond in JSON format:\n{{\n    \"intent\": \"detected intent\"\
    ,\n    \"domain\": \"detected domain\", \n    \"complexity\": \"assessed complexity\",\n    \"routing_recommendation\"\
    : \"recommended routing\",\n    \"confidence\": 0.0,\n    \"reasoning\": \"detailed analysis explanation\",\n    \"additional_context\"\
    : {{\n        \"keywords\": [\"key\", \"terms\"],\n        \"requires_specialized_knowledge\": true/false,\n        \"\
    expected_response_type\": \"description\"\n    }}\n}}\n"
capabilities:
- intent_classification
- domain_identification
- complexity_assessment
- routing_recommendation
- context_extraction
- confidence_assessment
- keyword_identification
performance_config:
  enable_caching: true
  cache_ttl_seconds: 1800
  enable_parallel_processing: false
  timeout_seconds: 20
  retry_attempts: 2
validation_config:
  enable_response_validation: true
  require_json_format: true
  validate_confidence_range: true
  validate_required_fields: true
  minimum_reasoning_length: 15
error_handling:
  enable_graceful_degradation: true
  fallback_intent: conversation
  fallback_domain: general
  fallback_complexity: moderate
  fallback_routing: conversational
  fallback_confidence: 0.1
  log_parsing_errors: true
classification_taxonomies:
  intent_types:
  - analysis
  - information
  - conversation
  - action
  - clarification
  domain_types:
  - scientific
  - bioinformatics
  - virology
  - general
  - technical
  - conversational
  complexity_levels:
  - simple
  - moderate
  - complex
  - expert
  routing_strategies:
  - specialized_analysis
  - conversational
  - hybrid
  - fallback
domain_patterns:
  scientific_keywords:
  - analysis
  - protein
  - sequence
  - structure
  - data
  - research
  - study
  bioinformatics_keywords:
  - pssm
  - alignment
  - genome
  - phylogeny
  - annotation
  - blast
  conversational_keywords:
  - what
  - how
  - why
  - explain
  - tell me
  - describe
  action_keywords:
  - create
  - generate
  - make
  - build
  - analyze
  - process
framework_integration:
  component_type: specialized_agent
  required_interfaces:
  - query_analysis
  - json_output
  - intent_classification
  optional_interfaces:
  - caching
  - monitoring
  - domain_classification
logging_config:
  log_level: INFO
  log_requests: true
  log_responses: false
  log_performance_metrics: true
  log_classification_results: true
  enable_detailed_tracing: false
testing_config:
  enable_self_testing: false
  test_queries:
  - What is the protein structure of Chikungunya virus?
  - How do viruses cause disease?
  - Create a PSSM matrix for Eastern Equine Encephalitis virus
  - Tell me about alphavirus evolution
  - Analyze the phylogeny of togaviruses
  expected_classifications:
    scientific_query_accuracy: 0.9
    intent_classification_accuracy: 0.85
    domain_classification_accuracy: 0.9
    json_format_compliance: 1.0
advanced_features:
  enable_sentiment_analysis: false
  enable_urgency_detection: false
  enable_user_expertise_estimation: false
  enable_query_expansion_suggestions: true
  enable_related_topic_identification: true
context_config:
  consider_conversation_history: false
  extract_named_entities: true
  identify_relationships: true
  assess_information_density: true
