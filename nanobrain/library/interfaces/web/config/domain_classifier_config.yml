method: keyword_based
confidence_thresholds:
  high_confidence: 0.8
  medium_confidence: 0.6
  low_confidence: 0.4
domain_patterns:
  bioinformatics:
  - protein
  - sequence
  - genome
  - virus
  - viral
  - biological
  - molecular
  - genetic
  analysis:
  - analyze
  - analysis
  - statistical
  - computation
  - calculate
  data_processing:
  - process
  - transform
  - convert
  - format
  - parse
performance_config:
  enable_caching: true
  cache_ttl_seconds: 1800
  case_sensitive: false
classification_config:
  allow_multiple_domains: true
  minimum_keyword_matches: 1
  boost_primary_domain: true
