method: keyword_based
intent_patterns:
  question:
    keywords:
    - what
    - how
    - when
    - where
    - why
    - explain
    - describe
  analysis_request:
    keywords:
    - analyze
    - examine
    - study
    - investigate
    - process
  data_request:
    keywords:
    - show
    - display
    - list
    - find
    - search
  workflow_request:
    keywords:
    - run
    - execute
    - start
    - perform
advanced_patterns:
  use_regex: true
  case_sensitive: false
  word_boundaries: true
  enable_stemming: false
  enable_synonyms: false
confidence_thresholds:
  high_confidence: 0.8
  medium_confidence: 0.6
  low_confidence: 0.4
performance_config:
  enable_caching: true
  cache_ttl_seconds: 1800
  case_sensitive: false
