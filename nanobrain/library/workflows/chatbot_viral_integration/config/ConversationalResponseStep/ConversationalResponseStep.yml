name: conversational_response
description: Generate intelligent conversational responses about viruses
class: nanobrain.library.workflows.chatbot_viral_integration.steps.conversational_response_step.ConversationalResponseStep
config:
  name: conversational_response
  description: Generate conversational responses using enhanced agent
  debug_mode: false
  enable_logging: true
  log_data_transfers: true
  conversational_agent:
    class: nanobrain.library.agents.specialized.viral_expert_agent.ViralExpertConversationalAgent
    config: config/ConversationalResponseStep/ViralExpertAgent.yml
input_data_units:
  query_input:
    class: nanobrain.core.data_unit.DataUnitMemory
    name: query_input
    description: User query input for conversational response processing
    persistent: false
output_data_units:
  response_data:
    class: nanobrain.core.data_unit.DataUnitMemory
    name: response_data
    description: Processed conversational response output data
    persistent: false
triggers:
- trigger_id: input_data_received
  class: nanobrain.core.trigger.DataUnitChangeTrigger
  data_unit: query_input
  event_type: set
  description: Execute conversational response when query input is received
timeout: 30.0
max_retries: 3
retry_delay: 1.0
response_config:
  max_response_length: 1000
  enable_citations: true
  response_style: conversational
response_templates:
  general_info: "I can help you with information about viruses and viral proteins. \n\n{response_content}\n\nWould you like\
    \ me to analyze specific viral proteins or provide more detailed information?\n"
  capability_explanation: 'I can help you with:

    - Viral protein analysis and annotation

    - Protein sequence clustering and comparison

    - Viral taxonomy and classification

    - Functional analysis of viral proteins


    What specific aspect would you like to explore?

    '
  follow_up_suggestion: '{response_content}


    Some follow-up questions you might consider:

    - {follow_up_questions}

    '
literature_search:
  enabled: true
  max_references: 5
  prefer_recent_papers: true
  citation_style: brief
use_markdown: true
include_confidence_score: true
add_follow_up_suggestions: true
maintain_conversation_context: true
max_context_turns: 10
protein_annotation_explanations: true
methodology_descriptions: true
result_interpretation_help: true
