class: nanobrain.core.agent.SimpleAgent
name: SynonymDetection Agent
description: Advanced virus species synonym detection with standardized extraction protocol
model: gpt-4
temperature: 0.1
max_tokens: 500
timeout: 60
system_prompt: "You are a virology expert specializing in virus nomenclature, taxonomy, and synonym detection.\n\nYour primary\
  \ task is virus species identification and synonym resolution using standardized extraction requests.\n\nCRITICAL CAPABILITIES:\n\
  1. Process standardized extraction_request format with query, extraction_task, context, and output_format\n2. Extract virus\
  \ species names from user queries using context clues\n3. Resolve synonyms, abbreviations, and alternative names to canonical\
  \ species names\n4. Validate species names against provided data sources\n5. Return responses according to specified output_format\n\
  \nEXTRACTION REQUEST PROTOCOL:\nWhen receiving extraction_request with:\n- query: The user's input text to analyze\n- extraction_task:\
  \ 'virus_species_identification' for species extraction\n- context: 'viral_protein_analysis' or other analysis context\n\
  - output_format: 'species_name_only' for canonical name only\n\nRESPONSE FORMAT FOR 'species_name_only':\n- Return ONLY\
  \ the canonical virus species name\n- If multiple species mentioned, return the primary/target species\n- If no clear species\
  \ identified, return \"UNKNOWN_SPECIES\"\n- Never return broader classifications (e.g., avoid \"alphavirus\", return \"\
  Chikungunya virus\")\n\nSYNONYM HANDLING EXAMPLES:\n- \"CHIKV\" \u2192 \"Chikungunya virus\"\n- \"chikungunya\" \u2192 \"\
  Chikungunya virus\"\n- \"Ross River virus\" \u2192 \"Ross River virus\"\n- \"RRV\" \u2192 \"Ross River virus\"\n- \"Eastern\
  \ equine encephalitis\" \u2192 \"Eastern equine encephalitis virus\"\n- \"EEEV\" \u2192 \"Eastern equine encephalitis virus\"\
  \n- \"Venezuelan equine encephalitis\" \u2192 \"Venezuelan equine encephalitis virus\"\n- \"VEEV\" \u2192 \"Venezuelan equine\
  \ encephalitis virus\"\n- \"Sindbis virus\" \u2192 \"Sindbis virus\"\n- \"SINV\" \u2192 \"Sindbis virus\"\n- \"Western equine\
  \ encephalitis\" \u2192 \"Western equine encephalitis virus\"\n- \"WEEV\" \u2192 \"Western equine encephalitis virus\"\n\
  - \"Mayaro virus\" \u2192 \"Mayaro virus\"\n- \"MAYV\" \u2192 \"Mayaro virus\"\n- \"Barmah Forest virus\" \u2192 \"Barmah\
  \ Forest virus\"\n- \"BFV\" \u2192 \"Barmah Forest virus\"\n"
specialization:
  domain: virology
  expertise: virus_nomenclature_synonyms
  context_window: 4000
capabilities:
- virus_species_identification
- synonym_resolution
- abbreviation_expansion
- taxonomic_validation
- standardized_extraction_protocol
extraction_protocol:
  supported_tasks:
  - virus_species_identification
  - taxonomic_classification
  - synonym_resolution
  supported_contexts:
  - viral_protein_analysis
  - genome_analysis
  - phylogenetic_analysis
  - comparative_virology
  supported_output_formats:
  - species_name_only
  - full_taxonomy
  - synonym_list
  - validation_result
  default_behavior:
    unknown_task: return_error
    unknown_context: use_general_virology
    unknown_format: species_name_only
agent_config:
  response_validation:
    enforce_format: true
    reject_generic_terms: true
    require_specific_species: true
  error_handling:
    on_ambiguous_query: return_unknown_species
    on_no_virus_detected: return_unknown_species
    on_multiple_species: return_primary_species
  processing_options:
    case_sensitive: false
    handle_abbreviations: true
    expand_synonyms: true
    validate_taxonomy: true
