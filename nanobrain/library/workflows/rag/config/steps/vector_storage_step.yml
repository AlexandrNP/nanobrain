# Vector Storage Step Configuration
# Database operations for storing and retrieving embeddings

name: "vector_storage_step"
description: "Deterministic vector database operations for storing and retrieving embeddings"

# Vector database configuration
vector_db_type: "faiss"
index_type: "IVF"
dimension: 384  # Matches sentence-transformers default
enable_persistence: true
persistence_path: "data/rag_index"

# Performance settings
batch_insert_size: 1000
enable_gpu: false
memory_map: true
enable_compression: false

# FAISS-specific configuration
faiss_config:
  nlist: 100          # Number of clusters for IVF
  nprobe: 10          # Number of clusters to search
  metric: "COSINE"        # Distance metric: L2, IP (inner product), COSINE
  enable_gpu: false
  gpu_device: 0
  use_precomputed_tables: true
  
  # Index factory string for advanced configurations
  # Examples:
  # - "IVF100,Flat" - IVF with flat quantizer
  # - "IVF100,PQ8" - IVF with product quantization
  # - "HNSW32" - Hierarchical Navigable Small World
  index_factory: "IVF100,Flat"

# Alternative database configurations (commented out)

# Pinecone configuration:
# vector_db_type: "pinecone"
# pinecone_config:
#   api_key_env: "PINECONE_API_KEY"
#   environment: "us-west1-gcp"
