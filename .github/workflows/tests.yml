name: tests

on:
  push:
    branches: [main, master, academy-integration]
  pull_request:
    branches: [main, master]

jobs:
  unit:
    name: unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    # G21 Step 4 + G5 Step 2 integration backends. Both honor the
    # standard health-check / port-mapping pattern; tests gated on
    # POSTGRES_TEST_DSN / REDIS_TEST_HOST env vars run automatically
    # when these services are reachable from the runner.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Make the integration tests opt-in via the same env-var contract
      # the local-dev recipe uses (test files document this).
      POSTGRES_TEST_DSN: postgresql://postgres:test@localhost:5432/postgres
      REDIS_TEST_HOST: localhost
      REDIS_TEST_PORT: "6379"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install nanobrain[test]
        # ``test`` extra includes pytest + pytest-asyncio + pytest-cov
        # + proxystore + psycopg[binary] (see pyproject.toml).
        run: |
          pip install -e '.[test]'

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --tb=short --cov=nanobrain --cov-report=term-missing

  lint:
    name: ruff (read-only)
    runs-on: ubuntu-latest
    # Advisory only — does not gate merges. Drop ``continue-on-error`` to
    # turn lint failures into CI failures once the repo is ruff-clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check nanobrain/
